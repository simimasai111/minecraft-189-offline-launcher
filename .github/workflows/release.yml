name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build offline bundle (game + JRE)
        run: python scripts/build_bundle.py

      - name: Verify bundle exists
        run: |
          if (!(Test-Path bundle.zip)) { Write-Error "bundle.zip 未生成"; exit 1 }
          (Get-Item bundle.zip).Length / 1MB

      - name: Build release
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclaunch-exe
          path: target/release/mclaunch.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/mclaunch.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
